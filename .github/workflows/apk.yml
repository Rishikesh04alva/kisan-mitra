name: Build Kisan Mitra APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: flutter create . --platforms android --project-name kisan_mitra

      - name: Pin stable debug keystore (constant SHA-1 for Firebase)
        run: |
          mkdir -p ~/.android
          [ -f ci/debug.keystore ] && cp ci/debug.keystore ~/.android/debug.keystore || true

      - name: Inject runtime permissions into manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n</manifest>#' "$M"

      - name: Bump minSdk to 23 (Firebase Auth requirement)
        run: |
          G=android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$G"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$G"

      - name: Wire Firebase google-services (if config provided)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret not set - skipping Firebase wiring"
            exit 0
          fi
          echo "$GS_JSON" | base64 -d > android/app/google-services.json
          S=android/settings.gradle
          grep -q "google-services" "$S" || sed -i 's#id "org.jetbrains.kotlin.android" version "\(.*\)" apply false#id "org.jetbrains.kotlin.android" version "\1" apply false\n    id "com.google.gms.google-services" version "4.4.2" apply false#' "$S"
          A=android/app/build.gradle
          grep -q "com.google.gms.google-services" "$A" || sed -i 's#id "dev.flutter.flutter-gradle-plugin"#id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"#' "$A"

      - name: Configure ProGuard rules for TFLite
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          -keep class org.tensorflow.lite.** { *; }
          -dontwarn org.tensorflow.lite.gpu.**
          -dontwarn org.tensorflow.lite.gpu.experimental.**
          EOF
          G=android/app/build.gradle
          grep -q "proguard-rules.pro" "$G" || sed -i 's#signingConfig = signingConfigs.debug#signingConfig = signingConfigs.debug\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"#' "$G"

      - run: flutter pub get

      - name: Static analysis (non-blocking)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APKs split by ABI
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --dart-define=OPENROUTER_KEY=${{ secrets.OPENROUTER_API_KEY }} \
            2>&1 | tee /tmp/build.log

      - name: Publish error tail back to repo
        if: failure()
        run: |
          tail -c 12000 /tmp/build.log > BUILD_ERROR.txt || echo "log unavailable" > BUILD_ERROR.txt
          git config user.name "ci-log-bot"
          git config user.email "bot@users.noreply.github.com"
          git add BUILD_ERROR.txt
          git commit -m "ci: capture build failure log [skip ci]"
          git push

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kisan-mitra-apks
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publish APKs to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kisan Mitra v1.0.${{ github.run_number }}
          body: "Installable debug-signed APKs. Install app-armeabi-v7a-release.apk on older phones, app-arm64-v8a-release.apk on modern ones."
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
