name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create default Android debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kisan-mitra-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.${{ github.run_number }}
          name: "Kisan Mitra App Release v1.6.${{ github.run_number }}"
          body: |
            🌱 **Kisan Mitra — Smart Farmer Companion (Android App)**
            
            ### ✨ Features:
            - 📍 **Real-time Location & Weather Sync**: Automatic IP fallback, live GPS sync, and Indian agricultural region search.
            - 🔍 **Accurate Disease & Pest Scanner**: Instant leaf symptom classification with organic & chemical treatment dosages.
            - 🧪 **Crop & Disease-Specific Fertilizer Guide**: Stage-wise N-P-K schedules (Urea, DAP, MOP in kg/acre) and disease recovery nutrition.
            - 🚜 **Smart Irrigation Tracker**: Daily rain-aware watering decisions.
            - 🏛️ **Government Scheme Explorer**: PM-KISAN, PMFBY, KCC, Soil Health Card.
            - 🗣️ **Multilingual AI Assistant**: English, Hindi (हिंदी), and Marathi (मराठी).
            
            📥 **Download File:** [app-release.apk](https://github.com/Rishikesh04alva/kisan-mitra/releases/download/v1.6.${{ github.run_number }}/app-release.apk)
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
